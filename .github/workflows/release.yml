name: Release

# Baut die Installer für Windows und macOS.
#   - Tag v*                      -> Installer an einen Release-Entwurf hängen
#   - manuell mit Version          -> dasselbe, der Tag wird dabei angelegt
#   - manuell ohne Version         -> nur bauen, Ergebnisse als Artefakt
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Zu veröffentlichende Version, z. B. v0.1.0 (leer = nur bauen)'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            label: macos-universal
            title: macOS (universal)
            # Ein Paket für Intel UND Apple Silicon. `universal-apple-darwin`
            # ist kein rustup-Ziel: Tauri baut beide echten Ziele und fügt sie
            # zusammen -- deshalb müssen beide installiert sein.
            args: --target universal-apple-darwin
            rust-targets: aarch64-apple-darwin,x86_64-apple-darwin
          - platform: windows-latest
            label: windows-x64
            title: Windows (x64)
            args: ''
            rust-targets: ''

    name: ${{ matrix.title }}
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust-targets }}
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          key: ${{ matrix.label }}

      - uses: tauri-apps/tauri-action@v0
        id: tauri
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          args: ${{ matrix.args }}
          # Leerer Tag = nur bauen, nichts veröffentlichen.
          tagName: ${{ github.ref_type == 'tag' && github.ref_name || inputs.tag }}
          releaseName: MottulVideoLoader ${{ github.ref_type == 'tag' && github.ref_name || inputs.tag }}
          releaseBody: |
            Installation und erster Start: siehe `docs/INSTALL.md`.

            Die Pakete sind nicht signiert — Windows und macOS zeigen deshalb
            beim ersten Start eine Warnung. Die Anleitung beschreibt, wie man
            sie bestätigt.
          releaseDraft: true
          prerelease: false

      # Auch bei einer Veröffentlichung nützlich: die Ergebnisse liegen dann
      # zusätzlich sieben Tage am Lauf, ohne dass man den Entwurf öffnen muss.
      - name: Ergebnisse sichern
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.label }}
          # Windows legt unter target/release/bundle ab, der Universal-Build
          # unter target/universal-apple-darwin/release/bundle.
          path: |
            src-tauri/target/**/bundle/**/*.dmg
            src-tauri/target/**/bundle/**/*.exe
            src-tauri/target/**/bundle/**/*.app.tar.gz
          if-no-files-found: error
          retention-days: 7
