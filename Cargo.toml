# Ein Kern, mehrere Oberflächen: `core` kennt weder Fenster noch Terminal,
# `src-tauri` ist die Fenster-App, `cli` die Terminal-Variante für Systeme, auf
# denen der Fenster-Unterbau nicht läuft (macOS vor 11.3).
[workspace]
resolver = "2"
members = ["core", "cli", "src-tauri"]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.77"
authors = ["Mottul"]

[workspace.dependencies]
mottul-video-core = { path = "core" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["process", "io-util", "sync", "time", "macros", "rt-multi-thread"] }
# rustls statt native-tls: keine OpenSSL-Abhaengigkeit in den CI-Builds. Die
# Wurzelzertifikate kommen aus dem SYSTEMSPEICHER -- hinter einem TLS-pruefenden
# Firmen-Proxy scheitert sonst jeder Download.
reqwest = { version = "0.12", default-features = false, features = [
  "rustls-tls-native-roots",
  "charset",
  "http2",
] }
sha2 = "0.10"
hex = "0.4"
flate2 = "1"
uuid = { version = "1", features = ["v4"] }
thiserror = "2"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
strip = true
panic = "abort"
