name: Release

# Baut die Installer für Windows und macOS.
#   - Tag v*                      -> Installer an einen Release-Entwurf hängen
#   - manuell mit Version          -> dasselbe, der Tag wird dabei angelegt
#   - manuell ohne Version         -> nur bauen, Ergebnisse als Artefakt
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Zu veröffentlichende Version, z. B. v0.1.0 (leer = nur bauen)'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            label: macos-universal
            title: macOS (universal)
            # Ein Paket für Intel UND Apple Silicon. `universal-apple-darwin`
            # ist kein rustup-Ziel: Tauri baut beide echten Ziele und fügt sie
            # zusammen -- deshalb müssen beide installiert sein.
            args: --target universal-apple-darwin
            rust-targets: aarch64-apple-darwin,x86_64-apple-darwin
          - platform: windows-latest
            label: windows-x64
            title: Windows (x64)
            args: ''
            rust-targets: ''

    name: ${{ matrix.title }}
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust-targets }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.label }}

      - uses: tauri-apps/tauri-action@v0
        id: tauri
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          args: ${{ matrix.args }}
          # Leerer Tag = nur bauen, nichts veröffentlichen.
          tagName: ${{ github.ref_type == 'tag' && github.ref_name || inputs.tag }}
          releaseName: MottulVideoLoader ${{ github.ref_type == 'tag' && github.ref_name || inputs.tag }}
          releaseBody: |
            Installation und erster Start: siehe `docs/INSTALL.md`.

            Die Pakete sind nicht signiert — Windows und macOS zeigen deshalb
            beim ersten Start eine Warnung. Die Anleitung beschreibt, wie man
            sie bestätigt.
          releaseDraft: true
          prerelease: false

      # Terminal-Variante für Macs, auf denen der Fenster-Unterbau nicht läuft
      # (macOS vor 11.3). Reines Rust ohne WebView, deshalb reicht 10.13 --
      # so weit hinunter reichen auch yt-dlp und ffmpeg.
      - name: Terminal-Variante bauen
        if: matrix.platform == 'macos-latest'
        run: |
          MACOSX_DEPLOYMENT_TARGET=10.13 cargo build --release -p mottul-video-cli --target x86_64-apple-darwin
          MACOSX_DEPLOYMENT_TARGET=11.0  cargo build --release -p mottul-video-cli --target aarch64-apple-darwin
          mkdir -p pack/MottulVideoLoader-Terminal
          lipo -create -output pack/MottulVideoLoader-Terminal/mottulvideoloader \
            target/x86_64-apple-darwin/release/mottulvideoloader \
            target/aarch64-apple-darwin/release/mottulvideoloader
          cp cli/packaging/MottulVideoLoader.command cli/packaging/LIESMICH.txt pack/MottulVideoLoader-Terminal/
          chmod +x pack/MottulVideoLoader-Terminal/MottulVideoLoader.command
          (cd pack && zip -r ../MottulVideoLoader-Terminal-macos.zip MottulVideoLoader-Terminal)
          echo "--- Zielversionen der fertigen Datei ---"
          otool -l pack/MottulVideoLoader-Terminal/mottulvideoloader | grep -E "minos|platform" | head -4

      - name: Terminal-Variante an den Release hängen
        if: matrix.platform == 'macos-latest' && (github.ref_type == 'tag' || inputs.tag != '')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload "${{ github.ref_type == 'tag' && github.ref_name || inputs.tag }}" \
            MottulVideoLoader-Terminal-macos.zip --clobber

      # Auch bei einer Veröffentlichung nützlich: die Ergebnisse liegen dann
      # zusätzlich sieben Tage am Lauf, ohne dass man den Entwurf öffnen muss.
      - name: Ergebnisse sichern
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.label }}
          # Seit dem Werkstatt-Zuschnitt liegt das Bauverzeichnis im
          # Wurzelverzeichnis, nicht mehr unter src-tauri.
          path: |
            target/**/bundle/**/*.dmg
            target/**/bundle/**/*.exe
            MottulVideoLoader-Terminal-macos.zip
          if-no-files-found: error
          retention-days: 7
