name: CI

# Prüft bei jedem Push und Pull Request die Oberfläche (Typen, Bundle) und den
# Rust-Teil (Format, Lint, Tests) -- ohne Paketbau.
#
# Rust auf allen drei Systemen: Windows ist die Hauptplattform, und die
# schweren Fehler kamen nur dort vor (Errno 22 über die Pipe, yt-dlp lief nach
# dem Abbruch weiter). macOS prüft den Unix-Weg in `proctree` auf dem System,
# für das er gebraucht wird.
on:
  push:
  pull_request:

jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-latest, macos-latest]
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      # Die Oberfläche ist überall gleich: einmal prüfen genügt.
      - uses: actions/setup-node@v4
        if: runner.os == 'Linux'
        with:
          node-version: '22'
          cache: npm
      - if: runner.os == 'Linux'
        run: npm ci
      - name: Oberfläche bauen (inkl. Typprüfung)
        if: runner.os == 'Linux'
        run: npm run build

      - name: Systembibliotheken für Tauri
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2

      - name: Format
        if: runner.os == 'Linux'
        run: cargo fmt --all --check
      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Tests
        run: cargo test --workspace
